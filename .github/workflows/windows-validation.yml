name: Windows validation and candidate builds
on:
  workflow_dispatch:
  push:
    branches: [codex/comparaofx-2.0-etapa5]
  pull_request:
    branches: [codex/comparaofx-2.0-etapa5]
permissions:
  contents: read
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
  pyinstaller:
    needs: tests
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and smoke test PyInstaller
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'compara-build-pyinstaller.log'
          try {
            & ./scripts/build_windows.ps1 -Tool pyinstaller -OutputDir "$env:RUNNER_TEMP/codex-pyinstaller" *>&1 | Tee-Object -FilePath $log
            if (-not $?) { throw 'Build PyInstaller retornou falha.' }
          } catch {
            $tail = if (Test-Path -LiteralPath $log) { (Get-Content -LiteralPath $log -Tail 35) -join "`n" } else { '' }
            $message = ("$($_.Exception.Message)`n$tail").Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A')
            Write-Output "::error title=Diagnóstico sintético do build::$message"
            throw
          }
      - name: Benchmark PyInstaller onefile
        shell: pwsh
        run: |
          $exe = "$env:RUNNER_TEMP/codex-pyinstaller/ComparaOFX.exe"
          $startup = & ./scripts/benchmark_windows.ps1 -Exe $exe -Runs 15
          $startup | Write-Output
          python -m pip install -r requirements.txt
          if ($LASTEXITCODE -ne 0) { throw 'Instalação do benchmark falhou.' }
          $processing = & python scripts/benchmark_exe_processing.py $exe
          if ($LASTEXITCODE -ne 0) { throw 'Benchmark de processamento falhou.' }
          $processing | Write-Output
          $file = Get-Item -LiteralPath $exe
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $exe).Hash
          $distribution = if ($exe.Contains('.dist/')) { @(Get-ChildItem -LiteralPath $file.DirectoryName -Recurse -File) } else { @($file) }
          $totalBytes = ($distribution | Measure-Object -Property Length -Sum).Sum
          $runtime = & python --version
          $cpu = (Get-CimInstance Win32_Processor | Select-Object -First 1).Name
          $report = (@("candidato=PyInstaller onefile; smoke=PASS; bytes=$($file.Length); MiB=$($file.Length / 1MB); SHA256=$hash; distribution_files=$($distribution.Count); distribution_bytes=$totalBytes; Python=$runtime; CPU=$cpu; commit=$env:GITHUB_SHA; imagem=$env:ImageOS/$env:ImageVersion") + @($startup) + @($processing)) -join "`n"
          $report | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
          $escaped = $report.Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A')
          Write-Output "::notice title=Resultado sintético PyInstaller::$escaped"
      - uses: actions/upload-artifact@v4
        with:
          name: comparaofx-pyinstaller-candidate
          path: ${{ runner.temp }}/codex-pyinstaller/ComparaOFX.exe
          if-no-files-found: error
          retention-days: 7
  nuitka:
    needs: tests
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and smoke test Nuitka standalone and onefile
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'compara-build-nuitka.log'
          try {
            & ./scripts/build_windows.ps1 -Tool nuitka -OutputDir "$env:RUNNER_TEMP/codex-nuitka" *>&1 | Tee-Object -FilePath $log
            if (-not $?) { throw 'Build Nuitka retornou falha.' }
          } catch {
            $tail = if (Test-Path -LiteralPath $log) { (Get-Content -LiteralPath $log -Tail 35) -join "`n" } else { '' }
            $message = ("$($_.Exception.Message)`n$tail").Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A')
            Write-Output "::error title=Diagnóstico sintético do build::$message"
            throw
          }
      - name: Benchmark Nuitka standalone and onefile
        shell: pwsh
        run: |
          foreach ($variant in @('standalone', 'onefile')) {
            $relative = if ($variant -eq 'standalone') { 'standalone/comparaArqOFX.dist/comparaArqOFX.exe' } else { 'onefile/ComparaOFX.exe' }
            $exe = "$env:RUNNER_TEMP/codex-nuitka/$relative"
            $startup = & ./scripts/benchmark_windows.ps1 -Exe $exe -Runs 15
            $startup | Write-Output
            python -m pip install -r requirements.txt
            if ($LASTEXITCODE -ne 0) { throw 'Instalação do benchmark falhou.' }
            $processing = & python scripts/benchmark_exe_processing.py $exe
            if ($LASTEXITCODE -ne 0) { throw 'Benchmark de processamento falhou.' }
            $processing | Write-Output
            $file = Get-Item -LiteralPath $exe
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $exe).Hash
            $distribution = if ($exe.Contains('.dist/')) { @(Get-ChildItem -LiteralPath $file.DirectoryName -Recurse -File) } else { @($file) }
            $totalBytes = ($distribution | Measure-Object -Property Length -Sum).Sum
            $runtime = & python --version
            $cpu = (Get-CimInstance Win32_Processor | Select-Object -First 1).Name
            $report = (@("candidato=Nuitka $variant; smoke=PASS; bytes=$($file.Length); MiB=$($file.Length / 1MB); SHA256=$hash; distribution_files=$($distribution.Count); distribution_bytes=$totalBytes; Python=$runtime; CPU=$cpu; commit=$env:GITHUB_SHA; imagem=$env:ImageOS/$env:ImageVersion") + @($startup) + @($processing)) -join "`n"
            $report | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
            $escaped = $report.Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A')
            Write-Output "::notice title=Resultado sintético Nuitka ${variant}::$escaped"
          }
      - uses: actions/upload-artifact@v4
        with:
          name: comparaofx-nuitka-candidate
          path: |
            ${{ runner.temp }}/codex-nuitka/onefile/ComparaOFX.exe
            ${{ runner.temp }}/codex-nuitka/standalone/comparaArqOFX.dist/
          if-no-files-found: error
          retention-days: 7
