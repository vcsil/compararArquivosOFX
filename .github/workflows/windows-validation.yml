name: Windows validation and candidate builds
on:
  workflow_dispatch:
  push:
    branches: [codex/comparaofx-2.0-etapa5]
  pull_request:
    branches: [codex/comparaofx-2.0-etapa5]
permissions:
  contents: read
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
  pyinstaller:
    needs: tests
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and smoke test PyInstaller
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'compara-build-pyinstaller.log'
          try {
            & ./scripts/build_windows.ps1 -Tool pyinstaller -OutputDir "$env:RUNNER_TEMP/codex-pyinstaller" *>&1 | Tee-Object -FilePath $log
            if (-not $?) { throw 'Build PyInstaller retornou falha.' }
          } catch {
            $tail = if (Test-Path -LiteralPath $log) { (Get-Content -LiteralPath $log -Tail 35) -join "`n" } else { '' }
            $message = ("$($_.Exception.Message)`n$tail").Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A')
            Write-Output "::error title=Diagnóstico sintético do build::$message"
            throw
          }
      - name: Benchmark PyInstaller onefile
        shell: pwsh
        run: |
          ./scripts/benchmark_windows.ps1 -Exe "$env:RUNNER_TEMP/codex-pyinstaller/ComparaOFX.exe" -Runs 15
          python -m pip install -r requirements.txt
          python scripts/benchmark_exe_processing.py "$env:RUNNER_TEMP/codex-pyinstaller/ComparaOFX.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: comparaofx-pyinstaller-candidate
          path: ${{ runner.temp }}/codex-pyinstaller/ComparaOFX.exe
          if-no-files-found: error
          retention-days: 7
  nuitka:
    needs: tests
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and smoke test Nuitka standalone and onefile
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'compara-build-nuitka.log'
          try {
            & ./scripts/build_windows.ps1 -Tool nuitka -OutputDir "$env:RUNNER_TEMP/codex-nuitka" *>&1 | Tee-Object -FilePath $log
            if (-not $?) { throw 'Build Nuitka retornou falha.' }
          } catch {
            $tail = if (Test-Path -LiteralPath $log) { (Get-Content -LiteralPath $log -Tail 35) -join "`n" } else { '' }
            $message = ("$($_.Exception.Message)`n$tail").Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A')
            Write-Output "::error title=Diagnóstico sintético do build::$message"
            throw
          }
      - name: Benchmark Nuitka onefile
        shell: pwsh
        run: |
          ./scripts/benchmark_windows.ps1 -Exe "$env:RUNNER_TEMP/codex-nuitka/onefile/ComparaOFX.exe" -Runs 15
          python -m pip install -r requirements.txt
          python scripts/benchmark_exe_processing.py "$env:RUNNER_TEMP/codex-nuitka/onefile/ComparaOFX.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: comparaofx-nuitka-candidate
          path: ${{ runner.temp }}/codex-nuitka/onefile/ComparaOFX.exe
          if-no-files-found: error
          retention-days: 7
